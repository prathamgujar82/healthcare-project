{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
    <div class="text-center">
      <i class="fas fa-user-plus text-6xl text-green-500 mb-4"></i>
      <h2 class="text-3xl font-extrabold text-slate-900">Create Account</h2>
      <p class="mt-2 text-sm text-slate-600">
        Already have an account? <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
      </p>
    </div>

    <form class="mt-8 space-y-6" action="/register" method="POST">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Choose Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-user text-slate-400"></i>
            </div>
            <input id="username" name="username" type="text" required
              class="appearance-none rounded-lg relative block w-full pl-10 px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
              placeholder="Username">
          </div>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Create Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-slate-400"></i>
            </div>
            <input id="password" name="password" type="password" required
              class="appearance-none rounded-lg relative block w-full pl-10 px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
              placeholder="Password">
          </div>
        </div>
      </div>

      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition shadow-md hover:shadow-lg">
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <i class="fas fa-check text-green-300 group-hover:text-green-200"></i>
          </span>
          Register
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
