<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report & Analysis | MedAI+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Report & Analysis</h2>
    <div class="card shadow p-4">
      <h5 class="mb-3">Past Predictions (Demo)</h5>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="table-light">
            <tr>
              <th>Date</th>
              <th>Symptoms</th>
              <th>Predicted Disease</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2024-06-01</td>
              <td>fever, cough, fatigue</td>
              <td>Flu</td>
            </tr>
            <tr>
              <td>2024-05-28</td>
              <td>headache, nausea</td>
              <td>Migraine</td>
            </tr>
            <tr>
              <td>2024-05-20</td>
              <td>itching, skin rash</td>
              <td>Allergy</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mt-3 text-end">
        <button class="btn btn-outline-primary">Download Report (PDF)</button>
      </div>
    </div>
  </div>
</body>
</html>
