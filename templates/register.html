{% extends "base.html" %}

{% block title %}Create Account | HealthsenseAI{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center bg-slate-50 py-12 px-6">
    <div class="max-w-md w-full space-y-8 animate-subtle">
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex w-16 h-16 bg-clinical-navy rounded-2xl items-center justify-center shadow-lg shadow-slate-200 mx-auto">
                <i class="fas fa-file-medical text-white text-2xl"></i>
            </div>
            <h2 class="text-4xl font-extrabold text-clinical-navy tracking-tight">Create Account</h2>
            <p class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Access clinical diagnostic records</p>
        </div>

        <!-- Card Container -->
        <div class="card-clinical bg-white p-8 md:p-10 space-y-6">
            <form action="/register" method="POST" class="space-y-6">
                <!-- Full Name Field -->
                <div class="space-y-2">
                    <label for="name" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Full Name</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="name" name="name" required placeholder="Dr. Jane Doe"
                               class="w-full bg-white border border-slate-200 rounded-xl py-4 pl-12 pr-4 text-clinical-navy placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-clinical-blue transition text-sm font-semibold">
                    </div>
                </div>

                <!-- Email Field -->
                <div class="space-y-2">
                    <label for="email" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="email" name="email" required placeholder="name@clinic.com"
                               class="w-full bg-white border border-slate-200 rounded-xl py-4 pl-12 pr-4 text-clinical-navy placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-clinical-blue transition text-sm font-semibold">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                               class="w-full bg-white border border-slate-200 rounded-xl py-4 pl-12 pr-4 text-clinical-navy placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-clinical-blue transition text-sm font-semibold">
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start">
                    <label class="relative flex items-start gap-3 cursor-pointer select-none">
                        <input type="checkbox" name="terms" required class="peer hidden">
                        <div class="w-5 h-5 rounded-md border-2 border-slate-200 bg-white peer-checked:bg-clinical-blue peer-checked:border-clinical-blue transition flex items-center justify-center shrink-0 mt-0.5">
                            <i class="fas fa-check text-[8px] text-white opacity-0 peer-checked:opacity-100 transition"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-500 leading-tight">I agree to the HIPAA Privacy standards and Clinical Terms of Use.</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full py-4 rounded-xl bg-clinical-navy text-white font-bold hover:bg-slate-800 shadow-xl shadow-slate-200 transition active:scale-98 flex items-center justify-center gap-2">
                    Register Account
                    <i class="fas fa-id-card text-xs"></i>
                </button>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-100"></div>
                <span class="flex-shrink mx-4 text-xs font-bold text-slate-300 uppercase tracking-widest">Already Registered</span>
                <div class="flex-grow border-t border-slate-100"></div>
            </div>

            <!-- Alternative CTA -->
            <a href="/login" class="w-full py-4 rounded-xl border border-slate-200 text-slate-600 font-bold text-center block hover:bg-slate-50 transition text-sm">
                Sign In Instead
            </a>
        </div>
    </div>
</div>
{% endblock %}
